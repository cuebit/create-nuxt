name: create-nuxt

services:
  app:
    build:
      context: .
      target: development
    command: >-
      sh -c "pnpm install --frozen-lockfile &&
      exec pnpm dev --host 0.0.0.0"
    init: true
    ports:
      - "${NUXT_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nuxt_build:/app/.nuxt

volumes:
  node_modules:
  nuxt_build:
